[package]
name = "stipple-bridge"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[features]
tracy = ["dep:tracing-subscriber", "dep:tracing-tracy"]

[dependencies]
# Brush deps.
brush-incremental.path = "../../crates/brush-incremental"
brush-render.path = "../../crates/brush-render"
brush-app.path = "../brush-app"

tokio = { workspace = true, features = ["io-util", "rt", "rt-multi-thread"] }

winit = { version = "0.30", features = ["default"] }
env_logger.workspace = true
egui.workspace = true
eframe.workspace = true
anyhow.workspace = true
log.workspace = true
glam.workspace = true
serde_json.workspace = true
image.workspace = true

tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
tracing-tracy = { workspace = true, optional = true }

cxx = "1.0.194"

[build-dependencies]
cxx-build = "1.0.194"

[lints]
workspace = true
